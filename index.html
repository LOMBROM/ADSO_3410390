   <script>
    // Espera a que cargue toda la página
    document.addEventListener('DOMContentLoaded', function() {
        const audio = document.getElementById('musicaFondo');
        
        // Configuración del audio
        audio.volume = 0.3; // Volumen al 30% (no molesto)
        
        // Intenta reproducir automáticamente
        const playAudio = function() {
            audio.play().then(() => {
                console.log('🎵 Música reproduciéndose');
            }).catch(error => {
                console.log('⏸️ Autoplay bloqueado, esperando clic del usuario');
            });
        };
        
        // Intenta reproducir al cargar
        playAudio();
        
        // Si el autoplay fue bloqueado, reproduce al primer clic del usuario
        document.addEventListener('click', function playOnClick() {
            audio.play().catch(error => {
                console.log('❌ Error al reproducir:', error);
            });
            // Remueve el evento después del primer clic
            document.removeEventListener('click', playOnClick);
        }, { once: true });
        
        // Opcional: Pausar si la página se oculta (ahorro de recursos)
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                audio.pause();
            } else {
                audio.play().catch(() => {});
            }
        });
    });
</script>
